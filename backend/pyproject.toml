[project]
name = "agent-control-backend"
version = "0.1.0"
description = "Configurable local agentic control system backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mss>=10.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pillow>=10.0",
  "pyautogui>=0.9.54",
  "pypdf>=5.0",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "uvicorn>=0.30",
  "websocket-client>=1.8",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]
e2e = [
  "telethon>=1.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
