[project]
name = "agent-control-backend"
version = "0.1.0"
description = "Configurable local agentic control system backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "cryptography>=42.0",
  "httpx>=0.27",
  "json-repair>=0.59",
  "mcp>=1.2",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pillow>=10.0",
  "pypdf>=5.0",
  "pyyaml>=6.0",
  "streamlit>=1.37",
  "structlog>=24.0",
  "uvicorn>=0.30",
  "websocket-client>=1.8",
]

[project.scripts]
ybm = "agent_control.cli:main"

[project.optional-dependencies]
# Desktop observation/control (computer.use, desktop.screenshot capabilities).
# Windows-only today; every import site lazy-imports these, so the package
# imports fine without this extra and only fails when a desktop tool actually runs.
desktop = [
  "mss>=10.0",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
]
voice = [
  "faster-whisper>=1.1",
  "kokoro-onnx>=0.5",
  "numpy>=2.0.2",
  "pyarrow>=24",
]
e2e = [
  "telethon>=1.36",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  # Browser UI diagnosis (Streamlit admin at :8501): after installing, run: python -m playwright install chromium
  "playwright>=1.40",
]
dev = [
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
