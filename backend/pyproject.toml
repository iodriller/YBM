[project]
name = "agent-control-backend"
version = "0.1.0"
description = "Configurable local agentic control system backend"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.0",
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "sqlmodel>=0.0.22",
  "structlog>=24.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
