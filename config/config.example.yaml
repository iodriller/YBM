server:
  host: "127.0.0.1"
  port: 8765
  public_base_url: null
  admin_enabled: true
  admin_token_env: "AGENT_ADMIN_TOKEN"

identity:
  instance_name: "local-agent-control"
  owner_label: "local-user"

channels:
  telegram:
    enabled: false
    token_env: "TELEGRAM_BOT_TOKEN"
    allowed_user_ids: []
    allowed_chat_ids: []
    polling: true

llm:
  default_profile: "localdeploy_qwen3vl_8b"
  major_profile: "localdeploy_qwen3vl_8b"
  fallback_profile: "openai_saved"
  profiles:
    localdeploy_qwen3vl_8b:
      provider: "openai_compatible"
      model: "qwen3vl_8b_ollama"
      base_url: "http://127.0.0.1:8000/v1"
      api_key_env: null
      timeout_seconds: 800
      max_tokens: 4096
      temperature: 0.1
      context_limit: 32768
    localdeploy_gemma3_12b:
      provider: "openai_compatible"
      model: "gemma3_12b_ollama_safe"
      base_url: "http://127.0.0.1:8000/v1"
      api_key_env: null
      timeout_seconds: 360
      max_tokens: 9000
      temperature: 0.2
      context_limit: 32768
    localdeploy_gemma3_4b:
      provider: "openai_compatible"
      model: "gemma3_4b_ollama_safe"
      base_url: "http://127.0.0.1:8000/v1"
      api_key_env: null
      timeout_seconds: 180
      max_tokens: 9000
      temperature: 0.2
      context_limit: 32768
    openai_saved:
      provider: "openai_compatible"
      model: "gpt-4.1"
      base_url: "https://api.openai.com/v1"
      api_key_env: "OPENAI_API_KEY"
      timeout_seconds: 60
      max_tokens: 4096
      temperature: 0.2

capabilities:
  telegram.receive:
    enabled: true
    scopes: []
    requires_approval: false
    max_risk_level: "low"
  telegram.send:
    enabled: true
    scopes: []
    requires_approval: false
    max_risk_level: "low"
  terminal.run:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "medium"
  filesystem.read:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "low"
  filesystem.write:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "high"
  vscode.read_state:
    enabled: false
    scopes: []
    requires_approval: false
    max_risk_level: "low"
  vscode.write_files:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "high"
  desktop.screenshot:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "medium"
  desktop.control:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "critical"
  browser.open:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "medium"
  browser.control:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "critical"
  network.http:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "high"
  schedule.manage:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "medium"
  github.push:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "critical"
  dependencies.install:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "high"

approval_policy:
  default_timeout_seconds: 900
  require_approval_at_or_above: "medium"
  approval_token_ttl_seconds: 900

storage:
  database_url: "sqlite:///./agent_control.db"
  artifact_dir: ".agent_control/artifacts"

secrets:
  path: ".agent_control/secrets/vault.json"
  key_env: "AGENT_SECRET_VAULT_KEY"

logging:
  level: "INFO"
  json_logs: true
  redact_patterns:
    - "token"
    - "api_key"
    - "secret"
    - "password"
    - "authorization"
    - "cookie"

limits:
  max_parallel_tasks: 1
  max_retries: 3
  tool_timeout_seconds: 900
  max_log_chars: 12000
  retry_backoff_seconds: 30

adapters:
  vscode:
    enabled: false
    bridge_host: "127.0.0.1"
    bridge_port: 8766
    auth_token_env: "VSCODE_BRIDGE_TOKEN"
  workspace:
    enabled: true
    root_dir: ".agent_control/workspaces"
    web_host: "127.0.0.1"
    web_port_start: 8890
    open_browser: true
  browser:
    enabled: true
    host: "127.0.0.1"
    remote_debugging_port: 9222
    chrome_path: null
    user_data_dir: ".agent_control/browser/chrome-profile"
    screenshot_dir: ".agent_control/browser/screenshots"
    launch_if_missing: true
    startup_timeout_seconds: 10
    default_wait_seconds: 1.5
    max_summary_chars: 6000
    search_url_template: "https://www.bing.com/search?q={query}"
  adapter_factory:
    enabled: true
    root_dir: ".agent_control/adapters"
  http_request:
    enabled: true
    allowed_hosts: []
    allowed_url_prefixes: []
    blocked_hosts: []
    timeout_seconds: 30
    max_response_chars: 100000
    max_body_chars: 100000
    user_agent: "YBM-http-request/1.0"
  terminal:
    enabled: false
    allowed_working_dirs: []
    blocked_command_patterns:
      - "rm -rf"
      - "del /s"
      - "format "
  coding_assistant:
    enabled: false
    command_template: []
    working_dir: null
    timeout_seconds: 900
    output_limit_chars: 12000
    rate_limit_patterns:
      - "rate limit"
      - "too many requests"
    usage_limit_patterns:
      - "usage limit"
      - "quota exceeded"
  coding_agent:
    enabled: true
    workspace_root: ".agent_control/workspaces"
    session_root: ".agent_control/coding_sessions"
    codex_path: null
    copilot_path: null
    claude_path: null
    use_runner: true
    timeout_seconds: 3600
    start_wait_seconds: 20
    output_limit_chars: 20000
    rate_limit_patterns:
      - "rate limit"
      - "too many requests"
    usage_limit_patterns:
      - "usage limit"
      - "quota exceeded"
      - "quota_exceeded"
      - "no quota"
      - "limit reached"
      - "messages are exhausted"
    codex_sandbox: "workspace-write"
    codex_skip_git_repo_check: true
    claude_permission_mode: "acceptEdits"
    copilot_allow_all: true
    copilot_no_ask_user: true
  code_interpreter:
    enabled: true
    workspace_root: ".agent_control/code_interpreter"
    timeout_seconds: 60
    max_code_chars: 20000
    max_output_chars: 12000
    max_files_listed: 200
    python_executable: null
    default_backend: "local_subprocess"
    backends:
      - "local_subprocess"
    untrusted_default_backend: "docker_python"
    # When true (default), untrusted/LLM-generated code silently runs unsandboxed
    # on the host (local_subprocess) if Docker is disabled/unavailable — check
    # code.interpreter health for a safety_warnings entry when that happens.
    # Set to false to refuse untrusted runs instead of falling back.
    fallback_to_local_when_backend_unavailable: true
    require_approval_for_untrusted_run_python: true
    network_policy: "disabled_by_default"
    package_policy: "disabled"
    allowed_packages: []
    resource_limits:
      memory: "512m"
      cpus: 1.0
      pids_limit: 128
    docker:
      enabled: false
      image: "python:3.12-slim"
      docker_path: "docker"
      pull_policy: "missing"
      network_enabled: false
      read_only_rootfs: false
      workspace_mount_target: "/workspace"
      remove_container: true
      run_as_user: null
    jupyter:
      enabled: false
      image: "python:3.12-slim"
      idle_timeout_seconds: 900
    remote_backends: {}
    session_ttl_seconds: 900
    allowed_imports:
      - "base64"
      - "collections"
      - "csv"
      - "datetime"
      - "decimal"
      - "functools"
      - "hashlib"
      - "html"
      - "itertools"
      - "json"
      - "math"
      - "pathlib"
      - "random"
      - "re"
      - "statistics"
      - "string"
      - "textwrap"
      - "typing"
      - "xml"
      - "zipfile"
    blocked_imports:
      - "ctypes"
      - "httpx"
      - "os"
      - "pip"
      - "requests"
      - "shutil"
      - "socket"
      - "subprocess"
      - "sys"
      - "urllib"
  desktop:
    screenshot_enabled: false
    control_enabled: false
    screenshot_interval_seconds: 10
    screenshot_format: "png"
  computer_use:
    enabled: false
    max_steps: 8
    step_delay_seconds: 0.4
    screenshot_dir: ".agent_control/computer_use/screenshots"
    allowed_apps: []
    allowed_roots:
      - ".agent_control/workspaces"
    require_session_approval: true
    max_ui_elements: 80
  artifact_delivery:
    recent_artifact_fallback_enabled: false
  stt:
    enabled: false
    provider: "faster_whisper"
    model: "base"
    device: "cpu"
    compute_type: "int8"
    language: null
    vad_filter: true
    beam_size: 5
    timeout_seconds: 120
    temp_dir: ".agent_control/stt"
    command: []
    static_transcript_env: "AGENT_STT_STATIC_TRANSCRIPT"
  tts:
    enabled: false
    provider: "kokoro_onnx"
    model_path: null
    voices_path: null
    voice: "af_sarah"
    language: "en-us"
    speed: 1.0
    output_dir: ".agent_control/tts"
    timeout_seconds: 120

mcp:
  enabled: false
  cache_ttl_seconds: 60
  catalog_path: ".agent_control/mcp/tool_catalog.json"
  servers: {}
